<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Lab 01.03</title>

    <style>

        body { 
            background-color: #555;
            color: #555;
            font-family: sans-serif;
            text-align: center;
        }

        .container {
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            border: 3px solid #999;
            width: 650px;
            height: 65vh;
            background-color: #ccc;
        }

        img {
            width: 90px; 
            float:left; 
            padding-right:30px;
        }

    </style>

</head>
<body>

    <div class="container">

        <div>
            <img src="../../../images/lab-testtube.jpg">
            <h1>JS Lab 01.03 <br> Nested Quotes <br> String Interpolation</h1>   
            <h3>See script tag in this html file for lab assignment.</h3>
            <h3>As you work, check the console for output and <span style="color:red">red error messages</span>. 
            <h3>Please check Lab Solution file only after giving the Lab your best effort!</h3>
        </div>

    </div>
    
    <script>

  // ********** Lab 01.03 Start ***********

        // Debug these strings by mixing-and-matching quotes.
        let cereal = 'Cap"n Crunch';
        console.log(cereal);  // Cap'n Crunch

        // let question = "\"Who\'s there?\" she asked.";
        let question = '"Who\'s there?" she asked.';
        console.log(question); // "Who's there?" she asked.

        // Debug these strings by escaping quotes with backslash:

        let phrase = 'Isn\'t that amazing!';
        console.log(phrase); // 'Isn't that amazing!

        let quote = '"Show me the money!" is a famous movie line.';
        console.log(quote); // "Show me the money!" is a famous movie line.

                
        // Use string interpolation to produce the messages in the comments:

        let pet = 'dog';
        let petName = 'Fido';
        let toy = 'frisbee';
        let msg1 = `My ${pet} ${petName}'s favorite toy is a ${toy}`;
        console.log(msg1); // My dog Fido’s favorite toy is a frisbee.

        let animal = 'kangaroo';
        let continent = 'Australia';
        let msg2 = `The ${animal} is native to ${continent}`;
        console.log(msg2); // The kangaroo is native to Australia.

        // This one requires you to combine math operations, which you practiced earlier, with string interpolation:
        let joint = "BOB'S DINER";
        let food = 30;
        let bev = 20;
        let subTotal = food + bev;
        let taxRate = 0.08; // 8%
        let tipPct = 0.2; // 20%;
        let tax = subTotal * taxRate;
        let tip = subTotal * tipPct;
        let grandTotal = subTotal + tax + tip;
        let guestCheck = `
            ${joint}
            GUEST CHECK:
            Food: $${food}
            Beverage: $${bev}
            Sub-Total: $${subTotal}
            Tax: $${tax}
            Tip: $${tip}
            TOTAL: $${grandTotal}
            THANK YOU!`;
        console.log(guestCheck);
        /*
        BOB'S DINER 
        GUEST CHECK:
        Food: $30
        Beverage: $20
        Sub-Total: $50
        Tax: $4
        Tip: $10
        TOTAL: $64
        THANK YOU!
        */
 
// END LAB 01.03

// SEE LAB 01.03 SOLUTON 

    </script>
    
</body>
</html>
