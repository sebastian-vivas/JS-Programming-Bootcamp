<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch API</title>

    <style>
      body {
        background-color: #445;
        text-align: center;
        color: #fff;
      }

      div {
        background-color: #aaa;
        width: 94%;
        margin: 0 auto;
        text-align: center;
        padding: 20px;
      }

      tr:nth-child(odd) {
        background-color: #ccc;
      }

      tr:nth-child(even) {
        background-color: aqua;
      }

      td {
        font-size: 0.9rem;
        font-family: sans-serif;
        color: #223;
      }

      table {
        border-collapse: collapse;
        /* width: 54%; */
        display: inline-block;
        margin-left: 20px;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
      }

      th {
        background-color: darkgreen;
        color: #fff;
      }

      td:nth-child(odd) {
        background-color: #f2f2ff;
      }

      h1 {
        text-align: center;
        color: #333;
        font-family: sans-serif;
      }
    </style>
  </head>

        style="
          overflow-y: scroll;
          width: 1300px;
          height: 600px;
          display: inline-block;
        "
      >

        </table>
      </div>
